[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-intelligence-pipeline"
version = "0.1.0"
description = "A compact synthetic-data quality and analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
