[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-intelligence-pipeline"
version = "0.2.1"
description = "A reproducible synthetic and public-data quality and analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
